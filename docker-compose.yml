services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kaokey
      POSTGRES_PASSWORD: kaokey
      POSTGRES_DB: kaokey
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaokey"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kaokey:kaokey@db:5432/kaokey
      ALLOWED_ORIGINS: http://localhost:5173
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  pgdata:
