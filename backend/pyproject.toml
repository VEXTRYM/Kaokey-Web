[project]
name = "kaokey-web-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3,<4",
  "argon2-cffi>=23,<27",
  "pydantic>=2,<3",
]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
[tool.pytest.ini_options]
pythonpath = ["."]
